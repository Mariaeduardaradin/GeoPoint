<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPoint - Detalhes do ponto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>GeoPoint</h1>
        <nav>
            <a href="index.html">Pontos</a>
            <a href="formulario.html">Cadastrar ponto</a>
        </nav>
    </header>

    <main>
        <section>
            <div class="cabecalho-detalhes">
                <h2>Detalhes do ponto</h2>
                <a href="index.html" class="botao botao-voltar">Voltar</a>
            </div>

            <p id="carregando">Carregando informações...</p>
            <p id="erro" class="escondido"></p>

            <div id="detalhes" class="escondido">
                <div class="informacoes-ponto">
                    <div class="info-item">
                        <strong>Nome</strong>
                        <p id="nome"></p>
                    </div>

                    <div class="info-item">
                        <strong>Descrição</strong>
                        <p id="descricao"></p>
                    </div>

                    <div class="info-item">
                        <strong>Latitude</strong>
                        <p id="latitude"></p>
                    </div>

                    <div class="info-item">
                        <strong>Longitude</strong>
                        <p id="longitude"></p>
                    </div>
                </div>

                <div class="acoes-detalhes">
                    <a id="editar" href="#" class="botao">Editar ponto</a>
                    <button id="excluir" class="botao-acao botao-excluir">Excluir ponto</button>
                </div>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/detalhe.js"></script>
</body>
</html>
